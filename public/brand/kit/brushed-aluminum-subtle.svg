<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Subtle brushed aluminum texture</title>
  <desc id="desc">Low-contrast horizontal brushed texture intended for restrained use.</desc>
  <defs>
    <linearGradient id="base" x1="0" x2="1">
      <stop stop-color="#9D9D9D"/>
      <stop offset=".5" stop-color="#B1B1B1"/>
      <stop offset="1" stop-color="#A2A2A2"/>
    </linearGradient>
    <pattern id="brush" width="800" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 2h800M0 7h800" stroke="#F4F4F4" stroke-width="1" opacity=".13"/>
      <path d="M0 5h800" stroke="#141414" stroke-width="1" opacity=".08"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#base)"/>
  <rect width="800" height="800" fill="url(#brush)"/>
</svg>


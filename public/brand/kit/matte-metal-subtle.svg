<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Subtle matte metal texture</title>
  <desc id="desc">Low-contrast neutral metal texture intended for restrained use.</desc>
  <filter id="matte">
    <feTurbulence type="fractalNoise" baseFrequency="0.18" numOctaves="3" seed="8"/>
    <feColorMatrix values=".4 0 0 0 .32 0 .4 0 0 .32 0 0 .4 0 .32 0 0 0 .12 0"/>
  </filter>
  <rect width="800" height="800" fill="#A6A6A6"/>
  <rect width="800" height="800" filter="url(#matte)" opacity="0.28"/>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <!-- Centered Stacked Logo Lockup -->
  <!-- 1. Dominant Monogram (Centered) -->
  <g transform="translate(100, 15) scale(0.9)">
    <g transform="skewX(-12) translate(22, 0)">
      <rect x="0" y="0" width="18" height="100" fill="#141414" />
      <rect x="18" y="42" width="24" height="16" fill="#141414" />
      <rect x="42" y="0" width="18" height="100" fill="#141414" />
      <polygon points="56,42 78,0 98,0 68,54" fill="#141414" />
      <polygon points="65,48 98,100 78,100 52,56" fill="#141414" />
    </g>
  </g>

  <!-- 2. Extended Full-Name Wordmark (Single Line, Centered, Lighter Weight) -->
  <text
    x="160"
    y="142"
    text-anchor="middle"
    font-family="-apple-system, 'GT America Extended', 'Helvetica Neue', Arial, sans-serif"
    font-size="14"
    font-weight="600"
    letter-spacing="0.28em"
    fill="#141414"
  >
    HARRISON KEITH
  </text>

  <!-- 3. Three Signature Color Stripes (Centered Below Wordmark) -->
  <g transform="translate(146, 160) scale(0.9)">
    <g transform="skewX(-12) translate(4, 0)">
      <rect x="0" y="0" width="6" height="14" fill="#E4BD25" />
      <rect x="9" y="0" width="6" height="14" fill="#B74438" />
      <rect x="18" y="0" width="6" height="14" fill="#438CA9" />
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 100" fill="none">
  <!-- HK Monogram: 12-degree forward rake, shared central structural spine -->
  <g transform="skewX(-12) translate(22, 0)">
    <!-- Left upright stem of H -->
    <rect x="0" y="0" width="18" height="100" fill="#141414" />
    <!-- Horizontal crossbar of H -->
    <rect x="18" y="42" width="24" height="16" fill="#141414" />
    <!-- Shared central spine: H right stem + K vertical backbone -->
    <rect x="42" y="0" width="18" height="100" fill="#141414" />
    <!-- Upper diagonal arm of K -->
    <polygon points="56,42 78,0 98,0 68,54" fill="#141414" />
    <!-- Lower diagonal leg of K -->
    <polygon points="65,48 98,100 78,100 52,56" fill="#141414" />
  </g>
</svg>
